name: Decision
about: Product, architecture, permission, privacy, destructive-action, or workflow decision.
title: "[DECISION] "
body:
  - type: input
    id: scope
    attributes:
      label: Scope
      placeholder: repo / chatgpt-cleaner / design-system
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Decision Required
      description: One decision only.
    validations:
      required: true

  - type: textarea
    id: facts
    attributes:
      label: Confirmed Facts / Constraints
      description: Separate verified facts from assumptions.
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options and Trade-offs
      description: Include the strongest reason not to choose the leading option.
    validations:
      required: true

  - type: textarea
    id: recommendation
    attributes:
      label: Recommended Decision
      description: Recommendation or "insufficient evidence".
    validations:
      required: true

  - type: dropdown
    id: owner
    attributes:
      label: Decision Owner
      options:
        - USER
        - CHATGPT
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        If accepted and durable, record the result under `docs/decisions/DEC-XXXX-short-title.md` and link it back to this Issue.
